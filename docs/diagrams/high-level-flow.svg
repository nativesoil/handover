<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="hl-title hl-desc">
  <title id="hl-title">Save here, load anywhere: one session, one file, another session</title>
  <desc id="hl-desc">The whole handover flow on one page, left to right. One session, in whatever tool you use, holds the decisions and the reasons for them. The command soil save carries it through both gates into one JSON file, plain text on your own disk at a path under a home directory. The command soil load carries that file back through both gates into another session, in another tool or another model, which continues from there. The two gates are named but not enumerated here: the ingestion boundary reads the bytes before anything is parsed, and the validator reads the document once those bytes are a value. Both run in both directions, because a stored file is bytes again, so it is judged again on the way out; nothing is stored until both pass. The rule-by-rule detail is in the round trip diagram. There are two doors into one store: the soil command line, and a local MCP server that your client starts as a process on your own machine. After install, this round trip needs no account, no network and no telemetry.</desc>

  <!-- The light palette rides in presentation attributes so it is the floor;
       the style block holds only the dark override, a deliberate inversion of
       the product's off-white surface: carbon ground, off-white ink, the same
       greens. The terminal panels are carbon in both themes, like the
       product's own full-carbon sections, so they carry no override. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .page  { fill: #101010; }
      .card  { fill: #1b1b19; stroke: #f4f2ed; stroke-opacity: 0.18; }
      .ink   { fill: #f4f2ed; }
      .muted { fill: #f4f2ed; }
      .faint { fill: #f4f2ed; }
      .hair  { stroke: #f4f2ed; stroke-opacity: 0.18; }
      .flow  { stroke: #f4f2ed; }
      .head  { fill: #f4f2ed; }
      .glyph { stroke: #f4f2ed; }
      .green { fill: #39CD75; }
      .gline { stroke: #39CD75; }
    }
  </style>

  <defs>
    <marker id="hl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0.5 L8 4 L0 7.5 Z" fill="#101010"/>
    </marker>
  </defs>

  <rect class="page" width="960" height="470" fill="#f4f2ed"/>

  <rect x="40" y="27" width="9" height="9" fill="#39CD75"/>
  <text class="ink" x="58" y="36" font-size="17" font-weight="700" fill="#101010">Save here, load anywhere</text>
  <text class="muted" x="40" y="60" font-size="12" fill="#101010" fill-opacity="0.7">One session, one file, another session. Nothing crosses a boundary unchecked.</text>
  <line class="hair" x1="40" y1="78" x2="920" y2="78" stroke="#101010" stroke-opacity="0.14" stroke-width="1"/>

  <!-- ============ one session ============ -->
  <rect x="40" y="104" width="230" height="150" rx="2" fill="#161512" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="58" cy="122" r="3.5" fill="#f4f2ed" fill-opacity="0.22"/>
  <circle cx="70" cy="122" r="3.5" fill="#f4f2ed" fill-opacity="0.22"/>
  <circle cx="82" cy="122" r="3.5" fill="#f4f2ed" fill-opacity="0.22"/>
  <text x="94" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f4f2ed" fill-opacity="0.5">any client</text>
  <line x1="40" y1="134" x2="270" y2="134" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text xml:space="preserve" x="57" y="162"><tspan fill="#39CD75">&#10095;</tspan><tspan fill="#f4f2ed"> soil save</tspan></text>
    <text x="57" y="188" fill="#f4f2ed" fill-opacity="0.62">the work, the decisions,</text>
    <text x="57" y="206" fill="#f4f2ed" fill-opacity="0.62">the reasons behind them</text>
  </g>
  <text class="ink" x="40" y="284" font-size="15" font-weight="700" fill="#101010">One session</text>
  <text class="muted" x="40" y="303" font-size="11.5" fill="#101010" fill-opacity="0.7">in whatever tool you use</text>

  <!-- ============ save, through both gates ============ -->
  <text class="muted" x="317" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#101010" fill-opacity="0.7">soil save</text>
  <line class="flow" x1="270" y1="180" x2="296" y2="180" stroke="#101010" stroke-width="1.5"/>
  <path class="page glyph" d="M317 163 L329 168 L329 178 C329 187 324 192.5 317 195 C310 192.5 305 187 305 178 L305 168 Z" fill="#f4f2ed" stroke="#101010" stroke-width="1.8"/>
  <polyline class="gline" points="311,179 315.5,183.5 323.5,173.5" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="flow" x1="338" y1="180" x2="360" y2="180" stroke="#101010" stroke-width="1.5" marker-end="url(#hl-arrow)"/>
  <text class="faint" x="317" y="217" font-size="10" text-anchor="middle" fill="#101010" fill-opacity="0.55">checked at</text>
  <text class="faint" x="317" y="230" font-size="10" text-anchor="middle" fill="#101010" fill-opacity="0.55">both gates</text>

  <!-- ============ one JSON file ============ -->
  <rect class="card" x="365" y="104" width="230" height="150" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <g class="glyph" transform="translate(458 122)" stroke="#101010" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3 H27 L37 13 V41 H7 Z"/>
    <path d="M27 3 V13 H37"/>
    <line x1="14" y1="23" x2="30" y2="23"/>
    <line x1="14" y1="30" x2="30" y2="30"/>
    <line x1="14" y1="37" x2="24" y2="37"/>
  </g>
  <rect x="447" y="152" width="8" height="8" fill="#39CD75"/>
  <text class="ink" x="480" y="196" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#101010">~/.soil/handovers/</text>
  <text class="ink" x="480" y="212" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#101010">001.json</text>
  <text class="muted" x="480" y="236" font-size="10.5" text-anchor="middle" fill="#101010" fill-opacity="0.7">readable with cat, diffable in git</text>
  <text class="ink" x="365" y="284" font-size="15" font-weight="700" fill="#101010">One JSON file</text>
  <text class="muted" x="365" y="303" font-size="11.5" fill="#101010" fill-opacity="0.7">plain text on your own disk</text>

  <!-- ============ load, through both gates again ============ -->
  <text class="muted" x="642" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#101010" fill-opacity="0.7">soil load</text>
  <line class="flow" x1="595" y1="180" x2="621" y2="180" stroke="#101010" stroke-width="1.5"/>
  <path class="page glyph" d="M642 163 L654 168 L654 178 C654 187 649 192.5 642 195 C635 192.5 630 187 630 178 L630 168 Z" fill="#f4f2ed" stroke="#101010" stroke-width="1.8"/>
  <polyline class="gline" points="636,179 640.5,183.5 648.5,173.5" fill="none" stroke="#0F6E56" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="flow" x1="663" y1="180" x2="685" y2="180" stroke="#101010" stroke-width="1.5" marker-end="url(#hl-arrow)"/>
  <text class="faint" x="642" y="217" font-size="10" text-anchor="middle" fill="#101010" fill-opacity="0.55">checked again,</text>
  <text class="faint" x="642" y="230" font-size="10" text-anchor="middle" fill="#101010" fill-opacity="0.55">both gates</text>

  <!-- ============ another session ============ -->
  <rect x="690" y="104" width="230" height="150" rx="2" fill="#161512" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="708" cy="122" r="3.5" fill="#f4f2ed" fill-opacity="0.22"/>
  <circle cx="720" cy="122" r="3.5" fill="#f4f2ed" fill-opacity="0.22"/>
  <circle cx="732" cy="122" r="3.5" fill="#f4f2ed" fill-opacity="0.22"/>
  <text x="744" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f4f2ed" fill-opacity="0.5">another client</text>
  <line x1="690" y1="134" x2="920" y2="134" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text xml:space="preserve" x="707" y="162"><tspan fill="#39CD75">&#10095;</tspan><tspan fill="#f4f2ed"> soil load '#001'</tspan></text>
    <text x="707" y="188" fill="#f4f2ed" fill-opacity="0.62">handover loaded &#183; <tspan fill="#39CD75">#001</tspan></text>
    <text x="707" y="206" fill="#f4f2ed" fill-opacity="0.62">it continues from here</text>
  </g>
  <text class="ink" x="690" y="284" font-size="15" font-weight="700" fill="#101010">Another session</text>
  <text class="muted" x="690" y="303" font-size="11.5" fill="#101010" fill-opacity="0.7">another tool, another model. It continues.</text>

  <!-- ============ the gates, named only ============ -->
  <rect class="card" x="40" y="326" width="880" height="88" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <text class="ink" x="57" y="348" font-size="12" font-weight="700" fill="#101010">The two gates</text>
  <text class="muted" x="57" y="366" font-size="11.5" fill="#101010" fill-opacity="0.7">The ingestion boundary reads the bytes, before anything is parsed. The validator reads the document once those bytes are a value.</text>
  <text class="muted" x="57" y="383" font-size="11.5" fill="#101010" fill-opacity="0.7">Both run in both directions: a stored file is bytes again, so it is judged again on the way out. Nothing is stored until both pass.</text>
  <text class="muted" x="57" y="400" font-size="11.5" fill="#101010" fill-opacity="0.7">Rule by rule, in order, with what each one refuses: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">docs/diagrams/round-trip.svg</tspan></text>

  <text class="muted" x="40" y="438" font-size="11.5" fill="#101010" fill-opacity="0.7">Two doors, one store: the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">soil</tspan> command line, and a local MCP server your client starts as a process on your own machine.</text>
  <text class="muted" x="40" y="456" font-size="11.5" fill="#101010" fill-opacity="0.7">After install, this round trip needs no account, no network and no telemetry.</text>
</svg>
