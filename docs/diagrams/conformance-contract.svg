<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 960 612" width="960" height="612" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">The conformance contract: one fixture list, five language runners</title>
  <desc id="cc-desc">One fixture list, conformance/fixtures/manifest.json, sits at the centre and five runners read it: TypeScript, Python, Go, Kotlin on the JVM, and C sharp on .NET. The list holds four groups: eleven valid documents that must be accepted, thirty-five invalid ones that must be refused at the semantic location each entry names, four valid documents whose rendering into a restore prompt is what is judged, and twenty-nine byte fixtures for the ingestion boundary. Twelve of the thirty-five invalid documents carry credential-shaped material, and the published JSON Schema accepts every one of them, so passing the schema alone is not conformance. The list is a contract rather than a test suite: it fixes which documents are accepted, which are refused, and where the error is located, as an ordered sequence of member names and array indices. It deliberately does not fix the message text, how a location is serialized, or the language's exception type. Results are reported as two separate claims, one about documents and one about writer behaviour.</desc>

  <!-- The light palette rides in presentation attributes so it is the floor;
       the style block holds only the dark override, a deliberate inversion of
       the product's off-white surface: carbon ground, off-white ink, the same
       greens. The drawn fixture counts and the description's figures are held
       to conformance/fixtures/manifest.json by conformance/README.test.ts, so
       a count here is derived, not decorative. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .page  { fill: #101010; }
      .card  { fill: #1b1b19; stroke: #f4f2ed; stroke-opacity: 0.18; }
      .ink   { fill: #f4f2ed; }
      .muted { fill: #f4f2ed; }
      .faint { fill: #f4f2ed; }
      .hair  { stroke: #f4f2ed; stroke-opacity: 0.18; }
      .flow  { stroke: #f4f2ed; }
      .head  { fill: #f4f2ed; }
      .green { fill: #39CD75; }
    }
  </style>

  <defs>
    <marker id="cc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0.5 L8 4 L0 7.5 Z" fill="#101010"/>
    </marker>
  </defs>

  <rect class="page" width="960" height="612" fill="#f4f2ed"/>

  <rect x="40" y="24" width="9" height="9" fill="#39CD75"/>
  <text class="ink" x="58" y="33" font-size="15" font-weight="600" fill="#101010">The conformance contract</text>
  <text class="muted" x="40" y="56" font-size="11" fill="#101010" fill-opacity="0.7">One fixture list, five language runners. The list is the contract, not a test suite: it fixes what is accepted, what is refused, and where.</text>
  <line class="hair" x1="40" y1="70" x2="920" y2="70" stroke="#101010" stroke-opacity="0.14" stroke-width="1"/>

  <!-- ============ the list ============ -->
  <rect class="card" x="40" y="92" width="480" height="316" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <text class="ink" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="59" y="114" font-size="11.5" font-weight="600" fill="#101010">conformance/fixtures/manifest.json</text>
  <text class="muted" x="59" y="131" font-size="10.5" fill="#101010" fill-opacity="0.7">Every entry carries its reason in plain language, so the list</text>
  <text class="muted" x="59" y="146" font-size="10.5" fill="#101010" fill-opacity="0.7">doubles as an explanation of the format's edges.</text>
  <line class="hair" x1="59" y1="156" x2="504" y2="156" stroke="#101010" stroke-opacity="0.14" stroke-width="1"/>

  <text class="green" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="59" y="174" font-size="11" font-weight="600" fill="#0F6E56">valid <tspan class="faint" fill="#101010" fill-opacity="0.55">· 11</tspan></text>
  <text class="muted" x="71" y="190" font-size="10.5" fill="#101010" fill-opacity="0.7">Documents every implementation must accept. One is the worked</text>
  <text class="muted" x="71" y="206" font-size="10.5" fill="#101010" fill-opacity="0.7">example from <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">examples/</tspan>, so the docs cannot drift from the format.</text>

  <text class="ink" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="59" y="230" font-size="11" font-weight="600" fill="#101010">invalid <tspan class="faint" fill="#101010" fill-opacity="0.55">· 35</tspan></text>
  <text class="muted" x="71" y="246" font-size="10.5" fill="#101010" fill-opacity="0.7">Documents that must be refused, each at the location the entry</text>
  <text class="muted" x="71" y="262" font-size="10.5" fill="#101010" fill-opacity="0.7">names. Twelve carry credential-shaped material, and the</text>
  <text class="muted" x="71" y="278" font-size="10.5" fill="#101010" fill-opacity="0.7">published schema accepts every one of those twelve.</text>

  <text class="ink" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="59" y="302" font-size="11" font-weight="600" fill="#101010">restore <tspan class="faint" fill="#101010" fill-opacity="0.55">· 4</tspan></text>
  <text class="muted" x="71" y="318" font-size="10.5" fill="#101010" fill-opacity="0.7">Valid documents whose content is written to be mistaken for the</text>
  <text class="muted" x="71" y="334" font-size="10.5" fill="#101010" fill-opacity="0.7">rendered prompt's own structure. The rendering is what is judged.</text>

  <text class="ink" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="59" y="358" font-size="11" font-weight="600" fill="#101010">boundary <tspan class="faint" fill="#101010" fill-opacity="0.55">· 29</tspan></text>
  <text class="muted" x="71" y="374" font-size="10.5" fill="#101010" fill-opacity="0.7">Bytes, not documents. Each states the boundary's verdict, and for</text>
  <text class="muted" x="71" y="390" font-size="10.5" fill="#101010" fill-opacity="0.7">an accepted one, what the validator must then say about it.</text>

  <!-- ============ what it fixes ============ -->
  <rect class="card" x="548" y="92" width="372" height="114" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <text class="ink" x="565" y="114" font-size="12" font-weight="600" fill="#101010">What the list fixes</text>
  <text class="ink" x="565" y="134" font-size="10.5" fill="#101010">which documents are accepted</text>
  <text class="ink" x="565" y="152" font-size="10.5" fill="#101010">which are refused</text>
  <text class="ink" x="565" y="170" font-size="10.5" fill="#101010">where the error is: an ordered sequence of member</text>
  <text class="ink" x="565" y="186" font-size="10.5" fill="#101010">names and array indices, from the root down</text>

  <rect class="card" x="548" y="218" width="372" height="100" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <text class="ink" x="565" y="240" font-size="12" font-weight="600" fill="#101010">What it deliberately does not fix</text>
  <text class="ink" x="565" y="260" font-size="10.5" fill="#101010">the message text</text>
  <text class="ink" x="565" y="278" font-size="10.5" fill="#101010">how a location is serialized</text>
  <text class="ink" x="565" y="296" font-size="10.5" fill="#101010">the language's exception type</text>
  <text class="faint" x="565" y="312" font-size="10" fill="#101010" fill-opacity="0.55">A formatting requirement is not a conformance requirement.</text>

  <rect class="card" x="548" y="330" width="372" height="78" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <text class="ink" x="565" y="352" font-size="12" font-weight="600" fill="#101010">Two claims, reported separately</text>
  <text class="ink" x="565" y="371" font-size="10.5" fill="#101010">Soil Document Conformant <tspan class="muted" fill="#101010" fill-opacity="0.7">· about documents</tspan></text>
  <text class="ink" x="565" y="387" font-size="10.5" fill="#101010">Soil Secure Writer Conformant <tspan class="muted" fill="#101010" fill-opacity="0.7">· about behaviour</tspan></text>
  <text class="faint" x="565" y="402" font-size="10" fill="#101010" fill-opacity="0.55">A reader-only implementation can honestly claim the first alone.</text>

  <!-- ============ the bus down to the runners ============ -->
  <line class="flow" x1="280" y1="408" x2="280" y2="448" stroke="#101010" stroke-width="1.5"/>
  <line class="flow" x1="124" y1="448" x2="836" y2="448" stroke="#101010" stroke-width="1.5"/>
  <text class="faint" x="852" y="444" font-size="10" fill="#101010" fill-opacity="0.55">the same list,</text>
  <text class="faint" x="852" y="457" font-size="10" fill="#101010" fill-opacity="0.55">read five times</text>

  <line class="flow" x1="124" y1="448" x2="124" y2="478" stroke="#101010" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line class="flow" x1="302" y1="448" x2="302" y2="478" stroke="#101010" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line class="flow" x1="480" y1="448" x2="480" y2="478" stroke="#101010" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line class="flow" x1="658" y1="448" x2="658" y2="478" stroke="#101010" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line class="flow" x1="836" y1="448" x2="836" y2="478" stroke="#101010" stroke-width="1.5" marker-end="url(#cc-arrow)"/>

  <rect class="card" x="40" y="484" width="168" height="52" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="56" y="497" width="7" height="7" fill="#39CD75"/>
  <text class="ink" x="70" y="506" font-size="11.5" font-weight="600" fill="#101010">TypeScript</text>
  <text class="faint" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="56" y="523" font-size="10" fill="#101010" fill-opacity="0.55">packages/sdk-ts</text>

  <rect class="card" x="218" y="484" width="168" height="52" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="234" y="497" width="7" height="7" fill="#39CD75"/>
  <text class="ink" x="248" y="506" font-size="11.5" font-weight="600" fill="#101010">Python</text>
  <text class="faint" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="234" y="523" font-size="10" fill="#101010" fill-opacity="0.55">packages/sdk-py</text>

  <rect class="card" x="396" y="484" width="168" height="52" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="412" y="497" width="7" height="7" fill="#39CD75"/>
  <text class="ink" x="426" y="506" font-size="11.5" font-weight="600" fill="#101010">Go</text>
  <text class="faint" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="412" y="523" font-size="10" fill="#101010" fill-opacity="0.55">packages/sdk-go</text>

  <rect class="card" x="574" y="484" width="168" height="52" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="590" y="497" width="7" height="7" fill="#39CD75"/>
  <text class="ink" x="604" y="506" font-size="11.5" font-weight="600" fill="#101010">Kotlin, on the JVM</text>
  <text class="faint" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="590" y="523" font-size="10" fill="#101010" fill-opacity="0.55">packages/sdk-jvm</text>

  <rect class="card" x="752" y="484" width="168" height="52" rx="2" fill="#ffffff" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="768" y="497" width="7" height="7" fill="#39CD75"/>
  <text class="ink" x="782" y="506" font-size="11.5" font-weight="600" fill="#101010">C#, on .NET</text>
  <text class="faint" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="768" y="523" font-size="10" fill="#101010" fill-opacity="0.55">packages/sdk-dotnet</text>

  <text class="muted" x="40" y="568" font-size="10.5" fill="#101010" fill-opacity="0.7">Each runner parses its own error locations into that sequence before comparing, in a small adapter at the top of the runner.</text>
  <text class="muted" x="40" y="586" font-size="10.5" fill="#101010" fill-opacity="0.7">A sixth implementation claims compatibility by passing the same list. Nobody administers the claim; you run it, it passes, you say so.</text>
</svg>
