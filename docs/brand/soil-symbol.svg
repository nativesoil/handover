  <title id="sy-title">The Native Soil symbol</title>
  <desc id="sy-desc">Two interlocking carbon blocks and one small green block, the seed. This is the colour variant for light backgrounds: carbon blocks, green seed. The geometry is the final brand asset and is never redrawn; the wordmark and the cover reuse these exact paths.</desc>

