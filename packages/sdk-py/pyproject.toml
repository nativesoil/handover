[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soil-handover"
version = "0.2.0"
description = "Python SDK for the Soil Handover Specification: types, validation, the extraction recipe, the local store, and the rail-card renderer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

authors = [{ name = "Mastodont AB" }]
keywords = ["soil", "handover", "ai", "context", "mcp"]

[project.urls]
Homepage = "https://github.com/nativesoil/handover"
Repository = "https://github.com/nativesoil/handover"
Issues = "https://github.com/nativesoil/handover/issues"

[tool.hatch.build.targets.wheel]
packages = ["soil_handover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
