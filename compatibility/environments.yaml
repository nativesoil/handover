# What this repository itself ships, described by who each surface is for.
# `for_whom` is required: a surface a reader cannot place themselves against
# is a surface they skip.
product_surfaces:
  - surface: Local CLI
    for_whom: You, at a terminal, driving the round trip by hand
    capability: [save, load, list, validate, check]
    maturity: works
    integration: local-cli
    evidence: reproducible-in-repo
    reproducible_in_repo: "yes"
    hosted_dependency: "no"
    evidence_date: "2026-07-24"
    limitation: The by-hand stranger test ran on macOS; CI covers three operating systems.
    evidence_source:
      - "The CLI suite runs on every push in [the CI workflow](.github/workflows/ci.yml), covering save, load, list, validate, check and the fail-closed refusal paths."
      - "A fresh-clone stranger test on 2026-07-24 ran the same round trip by hand. That run has no published artefact and is not what this row rests on."

  - surface: Local MCP server
    for_whom: Any MCP client on this machine, so the model saves and loads itself
    capability: [save, load, list]
    maturity: works
    integration: local-mcp
    evidence: reproducible-in-repo
    reproducible_in_repo: "yes"
    hosted_dependency: "no"
    evidence_date: "2026-07-24"
    limitation: The headless client session ran on macOS.
    evidence_source:
      - "Protocol round trip in the root test suite, run by [the CI workflow](.github/workflows/ci.yml) on every push."
      - "Headless Claude Code session on 2026-07-24 driving soil_list, soil_save and soil_load against a scratch store: [session report](compatibility/reports/local-mcp-claude-code.md)."

  - surface: Self-hostable server (preview)
    for_whom: An operator running one server for a team, on hardware they choose
    capability: [save, load, list, shared projects]
    maturity: works
    integration: self-hosted-http
    evidence: reproducible-in-repo
    reproducible_in_repo: "yes"
    hosted_dependency: "no"
    evidence_date: "2026-07-27"
    limitation: A preview. Single node, tokens the operator hands out, not hardened for multi-tenant use. Its MCP endpoint is exercised only by this repository's own suite; no external client has been run against it.
    evidence_source:
      - "The suite in [packages/server](packages/server) drives the running server over real HTTP on every push, through [the CI workflow](.github/workflows/ci.yml): bearer-token refusals, a personal save, list and load, a shared-project save read back by a second member, a non-member getting 404 on every project route, and the fail-closed refusal that stores nothing. The same suite drives the server's MCP endpoint over HTTP through the three tools."
      - "Not covered: no client outside this repository has been pointed at it, and the operator setup in [docs/server.md](docs/server.md) is run by hand rather than checked."

  - surface: TypeScript SDK
    for_whom: Developers building the format into their own tools, in TypeScript or JavaScript
    capability: [validate, save, load, check]
    maturity: works
    integration: local
    evidence: reproducible-in-repo
    reproducible_in_repo: "yes"
    hosted_dependency: "no"
    evidence_date: "2026-07-30"
    limitation: Conformance is a fixture suite; it says nothing about content quality.
    evidence_source:
      - "The official source implementation, and the one the CLI, the local MCP server and the self-hostable server are built on. Its suite and the TypeScript conformance runner run in [the CI workflow](.github/workflows/ci.yml) on ubuntu, macos and windows: document validation and the fail-closed writer pipeline, held to the shared fixtures."
      - "Load renders the restore prompt, and this SDK is the reference for its bytes: [its restore suite](packages/sdk-ts/src/restore.test.ts) and the adversarial restore fixtures in the conformance suite pin the output in [the CI workflow](.github/workflows/ci.yml), and the other four SDKs' restore goldens are generated from this SDK's built output."
      - "The cross-language store harness in the same workflow drives one writer per implementation against one store, and each suite holds the deterministic check report and card byte-identical to the reference over a shared corpus."

