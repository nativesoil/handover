# Compatibility data: the machine-readable source of truth.
#
# Two lists. `client_surfaces` holds third-party clients, one row per client
# surface and claim: a product's desktop app, its web page, its CLI and its
# IDE form are different surfaces, and they get different rows because what
# is true of one is routinely false of another. `product_surfaces` holds what
# this repository itself ships. docs/compatibility.md, the generated block
# inside README.md and compatibility/readme-snippet.md are GENERATED from
# this file and compatibility/integrations.yaml by
# scripts/generate-compatibility.mjs; .github/workflows/compatibility.yml
# fails when any of the three drifts from this data. Edit here, then run
# `node scripts/generate-compatibility.mjs`.
#
# This file is written in a deliberate YAML subset the generator parses
# without dependencies: top-level keys, list items of `key: value` pairs,
# flow arrays, and nested lists of quoted strings. No block scalars, no
# nested maps. The parser throws on anything outside the subset.
#
# THREE AXES, and no row ever collapses one into another.
#
# CAPABILITY (`maturity`) says what works. It is the primary axis, because a
# reader cares first about which features exist and which of them work.
#
#   maturity vocabulary, exactly four values:
#     works      every capability listed has been exercised end to end
#     partial    some of the listed capability works, the rest is not exercised
#     unproven   nothing exercised; the claim rests on a surface, not a run
#     planned    nothing exercised and nothing claimed; intent only
#
# EVIDENCE STRENGTH stays its own axis and never becomes the headline. Saying
# something works when only we have seen it is the same defect in a new place,
# so how a row was proven travels beside what it does.
#
#   evidence vocabulary, exactly six values. A label is used only when its
#   criteria are met:
#     reproducible-in-repo         an artefact in this repository reproduces
#                                  it: CI, the conformance suite, or a
#                                  runnable example anybody can run
#     open-integration-observed    a real run against an openly available
#                                  integration, recorded in a report committed
#                                  here; repeatable by hand, not automated
#     hosted-integration-observed  a real run that went through a hosted
#                                  service, recorded in a report committed here
#     maintainer-attested          the maintainers ran it and logged it
#                                  internally; no artefact a reader can inspect
#     source-reviewed              read from source, specification or the
#                                  vendor's documentation, never executed
#     planned                      nothing has been run; the row states an
#                                  intention, and carries no evidence
#
# An internal log with no publicly reproducible artefact is a maintainer
# attestation. There is no label that turns one into a demonstration.
#
# WHERE A CLAIM COMES FROM (`capability_source`, client rows only), exactly
# two values. What a client CAN do and what WE have shown are different
# statements, and a reader needs both, separately:
#   vendor-documentation   the vendor's own published documentation, cited in
#                          `vendor_doc` as a URL. It supports what a surface
#                          can attach. It never supports a run, so a row
#                          resting on it is `unproven` and `source-reviewed`,
#                          and the generator refuses anything stronger.
#   this-repository        this repository's own record: a run in CI, a
#                          committed session report, the maintainers'
#                          internal log, or a reading of code here. The
#                          `evidence` field says which.
#
# `paths` on a client row lists how that surface reaches the format, from a
# closed set the generator words for the reader:
#   local-stdio-mcp   a local MCP server the client starts on this machine
#   remote-http-mcp   an MCP server the user runs themselves, over HTTP
#   hosted-cloud      the hosted Native Soil connector, a separate service
#                     with accounts and no code in this repository
#   manual-paste      copy and paste through the client's own text box
#
# `runs_in` is required on every client row and takes exactly two values:
# `elsewhere` for a page in a browser or an app on a phone, `your machine`
# for a process on the reader's own computer. It describes the SURFACE,
# never the client as a whole: the same product can be a page in a browser
# on one row and a desktop process on another, and collapsing the two rows
# into one is how a sentence gets written about the wrong surface. A surface
# running elsewhere cannot start a local process, so the generator refuses a
# row that pairs `elsewhere` with `local-stdio-mcp`.
#
# `hosted_dependency` says whether the row exists only through the hosted
# connector. Hosted rows never appear in the README table, which carries
# `product_surfaces` alone; a reader who installs this repository does not
# get them.
#
# Every row also carries the evidence label, an evidence source, an evidence
# date, whether it is reproducible in the open repository, and its known
# limitation. `reproducible_in_repo` is yes, no or partial.

